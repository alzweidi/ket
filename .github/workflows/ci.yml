name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libjson-c-dev pkg-config
      - if: runner.os == 'macOS'
        run: brew install json-c pkg-config
      - run: make test
      - run: make sanitise
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make test-web
  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libjson-c-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.23
      - run: make wasm
      - run: git diff --exit-code -- playground/engine
      - run: make test-web playground
